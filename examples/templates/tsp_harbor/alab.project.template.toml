schema_version = 1

[project]
name = "TSP Harbor Template"
task = "Improve a deterministic Traveling Salesperson route builder across 15 fixed generated instances while a Harbor verifier scores the routes."
goal = "Show a Harbor template with public starter source, hidden verifier logs, and numeric-only minimize-direction Harbor reward metrics."
allow_public_exp_create = true

[mutable]
include = ["solution.py"]

[visibility]
scope = "same_project"

[runner]
type = "harbor"
timeout_seconds = 120
working_directory = "."
harbor_task_ref = "@TASK_DIR@"
network = "none"

[reward]
type = "harbor"
direction = "minimize"
primary_metric = "total_tour_length"

[logs]
stdout_limit_bytes = 20000
stderr_limit_bytes = 20000

[git]
author_name = "ALab TSP Harbor Template"
author_email = "alab-tsp-harbor-template@local"
