[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alab-cli"
version = "0.1.1"
description = "Local agent-first experiment workbench CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "ALab contributors" }]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "tomli-w>=1.0.0",
  "pathspec>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/bebetterest/ALab"
Repository = "https://github.com/bebetterest/ALab"
Issues = "https://github.com/bebetterest/ALab/issues"

[project.scripts]
alab = "alab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[tool.uv]
package = true

[tool.setuptools.package-data]
alab = ["migrations/*.sql", "dashboard_static/*", "dashboard_static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real_docker: opt-in tests that require a live Docker daemon and local or pullable Docker images",
  "real_skydiscover_python: opt-in tests that require uv to create a real SkyDiscover Python evaluator environment",
  "networked_skydiscover_python: opt-in tests that require uv network access to install SkyDiscover Python evaluator dependencies",
  "native_skydiscover_python: opt-in tests that require uv network access to install a native/binary SkyDiscover Python evaluator dependency",
  "live_skydiscover_catalog: opt-in tests that clone the live SkyDiscover catalog and resolve real catalog refs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
