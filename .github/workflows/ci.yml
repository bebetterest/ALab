name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      real_docker:
        description: Run real Docker integration tests.
        required: false
        type: boolean
        default: false
      real_skydiscover_python:
        description: Run real SkyDiscover Python local-wheel integration tests.
        required: false
        type: boolean
        default: false
      networked_skydiscover_python:
        description: Run networked and native SkyDiscover Python dependency tests.
        required: false
        type: boolean
        default: false
      live_skydiscover_catalog:
        description: Run live SkyDiscover catalog tests.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check release version files
        run: python .github/scripts/check_version_sync.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version-sync
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PYTHONPYCACHEPREFIX: /tmp/alab-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Show tool versions
        run: |
          python --version
          uv --version

      - name: Run ruff
        run: uv run --locked ruff check

  tests:
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-contract
            pytest_args: tests/test_cli_contract.py
            pytest_extra_args: "-n auto"
          - name: cli-user-scenarios
            pytest_args: tests/test_cli_user_scenarios.py
            pytest_extra_args: ""
          - name: dashboard
            pytest_args: tests/test_dashboard.py
            pytest_extra_args: ""
          - name: smoke
            pytest_args: tests/test_smoke.py
            pytest_extra_args: ""
          - name: runners
            pytest_args: tests/test_runner_docker.py tests/test_runner_harbor.py tests/test_runner_local.py tests/test_runner_skydiscover.py
            pytest_extra_args: ""
          - name: storage-auth-and-opt-in-skips
            pytest_args: tests/test_auth.py tests/test_errors.py tests/test_ids.py tests/test_migrations.py tests/test_real_docker.py tests/test_real_skydiscover_catalog.py tests/test_real_skydiscover_python.py
            pytest_extra_args: ""
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PYTHONPYCACHEPREFIX: /tmp/alab-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Show tool versions
        run: |
          python --version
          uv --version

      - name: Run pytest group
        run: uv run --locked pytest -q ${{ matrix.pytest_extra_args }} ${{ matrix.pytest_args }}

  real-docker:
    name: Real Docker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: version-sync
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_docker }}
    env:
      ALAB_RUN_REAL_DOCKER: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PYTHONPYCACHEPREFIX: /tmp/alab-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Show Docker version
        run: docker version

      - name: Run real Docker tests
        run: uv run --locked pytest -m real_docker -q

  real-skydiscover-python:
    name: Real SkyDiscover Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: version-sync
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_skydiscover_python }}
    env:
      ALAB_RUN_REAL_SKYDISCOVER_PYTHON: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PYTHONPYCACHEPREFIX: /tmp/alab-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Run real SkyDiscover Python tests
        run: uv run --locked pytest -m real_skydiscover_python -q

  networked-skydiscover-python:
    name: Networked SkyDiscover Python
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: version-sync
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.networked_skydiscover_python }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PYTHONPYCACHEPREFIX: /tmp/alab-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Run networked dependency tests
        env:
          ALAB_RUN_NETWORKED_SKYDISCOVER_PYTHON: "1"
        run: uv run --locked pytest -m networked_skydiscover_python -q

      - name: Run native dependency tests
        env:
          ALAB_RUN_NATIVE_SKYDISCOVER_PYTHON: "1"
        run: uv run --locked pytest -m native_skydiscover_python -q

  live-skydiscover-catalog:
    name: Live SkyDiscover Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: version-sync
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_skydiscover_catalog }}
    env:
      ALAB_RUN_LIVE_SKYDISCOVER_CATALOG: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PYTHONPYCACHEPREFIX: /tmp/alab-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Run live catalog tests
        run: uv run --locked pytest -m live_skydiscover_catalog -q -rs

  publish-python:
    name: Publish Python package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Check PyPI release state
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          package_name = project["name"]
          current = project["version"]
          normalized_name = re.sub(r"[-_.]+", "-", package_name).lower()
          project_url = f"https://pypi.org/pypi/{urllib.parse.quote(normalized_name)}/json"
          version_url = f"https://pypi.org/pypi/{urllib.parse.quote(normalized_name)}/{urllib.parse.quote(current)}/json"
          package_exists = False
          version_exists = False
          latest = "none"

          try:
              with urllib.request.urlopen(version_url, timeout=30) as response:
                  version_payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  version_payload = {"info": {}, "urls": []}
              else:
                  raise
          else:
              package_exists = True
              version_exists = True
              latest = version_payload.get("info", {}).get("version") or current

          try:
              with urllib.request.urlopen(project_url, timeout=30) as response:
                  project_payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              package_exists = True
              latest = project_payload.get("info", {}).get("version") or latest
              releases = project_payload.get("releases", {})
              if not version_exists:
                  version_exists = current in releases

          if package_exists and latest == "none":
              latest = current if version_exists else "none"

          should_publish = not version_exists
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_name={package_name}\n")
              output.write(f"version={current}\n")
              output.write(f"pypi_latest_version={latest}\n")
              output.write(f"pypi_package_exists={str(package_exists).lower()}\n")
              output.write(f"pypi_version_exists={str(version_exists).lower()}\n")
              output.write(f"should_publish={str(should_publish).lower()}\n")

          print(f"package name: {package_name}")
          print(f"current version: {current}")
          print(f"PyPI package exists: {package_exists}")
          print(f"PyPI latest version: {latest}")
          print(f"PyPI has current version: {version_exists}")
          print(f"should publish: {should_publish}")
          PY

      - name: Stop when PyPI already has current version
        if: ${{ steps.version.outputs.should_publish != 'true' }}
        run: |
          echo "PyPI already has ${{ steps.version.outputs.package_name }} ${{ steps.version.outputs.version }}; skipping publish."

      - name: Install build tools
        if: ${{ steps.version.outputs.should_publish == 'true' }}
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        if: ${{ steps.version.outputs.should_publish == 'true' }}
        run: python -m build

      - name: Check distributions
        if: ${{ steps.version.outputs.should_publish == 'true' }}
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ steps.version.outputs.should_publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Extract release notes
        if: ${{ steps.version.outputs.should_publish == 'true' }}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          changelog = Path("CHANGELOG.md")
          heading = re.compile(r"^##\s+\[?v?(?P<version>[^\]\s]+)\]?(?:\s+-\s+.*)?$")
          lines = changelog.read_text(encoding="utf-8").splitlines()
          start = None
          for index, line in enumerate(lines):
              match = heading.match(line.strip())
              if match and match.group("version") == version:
                  start = index + 1
                  break

          body_lines = []
          if start is not None:
              for line in lines[start:]:
                  if line.startswith("## "):
                      break
                  body_lines.append(line)

          body = "\n".join(body_lines).strip()
          if not body:
              body = f"See CHANGELOG.md for {version} release details."

          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      - name: Create GitHub release
        if: ${{ steps.version.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${PACKAGE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "alab-cli ${PACKAGE_VERSION}" \
              --notes-file release-notes.md
          fi

  publish-github-release-assets:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - tests
      - publish-python
      - publish-clawhub-skills
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Prepare GitHub release assets
        id: release_assets
        run: |
          python .github/scripts/github_release_assets.py prepare \
            --asset-output-dir release-assets \
            --notes-output release-notes.md

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_assets.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.release_assets.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; uploading assets."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "alab-cli ${PACKAGE_VERSION}" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-clawhub-skills:
    name: Publish ClawHub skills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    environment: clawhub
    env:
      CLAWHUB_REGISTRY: ${{ vars.CLAWHUB_REGISTRY || 'https://clawhub.ai' }}
      CLAWHUB_SITE: ${{ vars.CLAWHUB_SITE || vars.CLAWHUB_REGISTRY || 'https://clawhub.ai' }}
      CLAWHUB_OWNER: ${{ vars.CLAWHUB_OWNER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Check ClawHub skill release state
        id: clawhub
        run: python .github/scripts/clawhub_skill_release.py plan --plan-output clawhub-skill-plan.json

      - name: Stop when ClawHub already has current skill versions
        if: ${{ steps.clawhub.outputs.should_publish != 'true' }}
        run: |
          echo "ClawHub already has all ALab skill versions for ${{ steps.clawhub.outputs.version }}; skipping publish."

      - name: Set up Node
        if: ${{ steps.clawhub.outputs.should_publish == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ClawHub CLI
        if: ${{ steps.clawhub.outputs.should_publish == 'true' }}
        run: npm install -g clawhub

      - name: Log in to ClawHub
        if: ${{ steps.clawhub.outputs.should_publish == 'true' }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [[ -z "${CLAWHUB_TOKEN}" ]]; then
            echo "::error::CLAWHUB_TOKEN repository or environment secret is required to publish missing skill versions."
            exit 1
          fi
          clawhub login --token "${CLAWHUB_TOKEN}"
          clawhub whoami

      - name: Publish missing ClawHub skill versions
        if: ${{ steps.clawhub.outputs.should_publish == 'true' }}
        run: python .github/scripts/clawhub_skill_release.py publish --plan-input clawhub-skill-plan.json
